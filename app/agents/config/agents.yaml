agents:
  - id: main_tutor
    kind: main
    name: 主导师 Agent
    role: 探究教学主导师
    description: 负责完整教学流程引导、阶段推进、草案生成与编辑。
    capabilities:
      - stage_guidance
      - inquiry_coaching
      - draft_generation
      - draft_editing
      - stage_summary
    prompt_file: prompts/main_tutor.md
    selectable: false
    role_category: teacher

  - id: insect_agent
    kind: expert
    name: 昆虫 Agent
    role: 昆虫观察专家
    description: 昆虫识别思路、习性解释、观察记录和非侵扰提醒。
    capabilities:
      - insect_observation
      - identification_reasoning
      - behavior_explanation
      - non_intrusive_guidance
    prompt_file: prompts/experts/insect.md
    selectable: true
    role_category: teacher

  - id: nature_agent
    kind: expert
    name: 自然 Agent
    role: 自然生态专家
    description: 生态关系、季节变化以及植物、土壤和水文关系。
    capabilities:
      - ecosystem_relationships
      - seasonal_change
      - plant_soil_water_analysis
    prompt_file: prompts/experts/nature_ecology.md
    selectable: true
    role_category: teacher

  - id: mathematics_teacher_agent
    kind: expert
    name: 数学课老师 Agent
    role: 数据分析专家
    description: 测量、计数、抽样、统计、误差、图表和数据解释。
    capabilities:
      - measurement
      - sampling
      - statistics
      - chart_design
      - data_interpretation
    prompt_file: prompts/experts/mathematics.md
    selectable: true
    role_category: teacher

  - id: safety_agent
    kind: expert
    name: 安全 Agent
    role: 安全与伦理专家
    description: 户外风险、材料工具安全、生物伦理和活动边界。
    capabilities:
      - risk_assessment
      - outdoor_safety
      - tool_safety
      - biological_ethics
    prompt_file: prompts/experts/safety_ethics.md
    selectable: true
    role_category: teacher

  - id: physics_teacher_agent
    kind: expert
    name: 物理课老师 Agent
    role: 科学探究专家
    description: 探究问题、变量控制、实验设计、测量误差和物理解释。
    capabilities:
      - inquiry_question
      - variable_control
      - experiment_design
      - measurement_error
      - physics_explanation
    prompt_file: prompts/experts/physics.md
    selectable: true
    role_category: teacher

  - id: study_travel_main_tutor
    kind: main
    name: 研学主导师 Agent
    role: 研学基地培训主导师
    description: 负责研学基地培训完整流程引导、阶段推进、方案生成与编辑。
    capabilities:
      - study_flow_guidance
      - study_coaching
      - plan_generation
      - plan_editing
    prompt_file: prompts/study_travel_main_tutor.md
    selectable: false
    role_category: study_travel

  - id: village_secretary_agent
    kind: expert
    name: 村书记 Agent
    role: 乡村资源协调专家
    description: 乡村资源介绍、在地知识、人员协调、文化背景。
    capabilities:
      - local_resources
      - community_coordination
      - cultural_context
      - field_site_info
    prompt_file: prompts/experts/village_secretary.md
    selectable: true
    role_category: study_travel

  - id: study_travel_planner_agent
    kind: expert
    name: 研学策划 Agent
    role: 研学课程设计专家
    description: 研学课程设计、活动流程安排、时间规划、跨学科整合。
    capabilities:
      - itinerary_design
      - activity_planning
      - cross_subject_integration
      - schedule_optimization
    prompt_file: prompts/experts/study_travel_planner.md
    selectable: true
    role_category: study_travel

  - id: base_manager_agent
    kind: expert
    name: 研学基地负责人 Agent
    role: 基地运营专家
    description: 基地设施介绍、场地安排、接待能力、后勤保障。
    capabilities:
      - facility_info
      - logistics_support
      - capacity_planning
      - booking_coordination
    prompt_file: prompts/experts/base_manager.md
    selectable: true
    role_category: study_travel

  - id: parent_main_tutor
    kind: main
    name: 家庭探究主导师 Agent
    role: 家庭探究活动主导师
    description: 负责家庭场景探究流程引导、阶段推进、草案生成与编辑。
    capabilities:
      - family_inquiry_guidance
      - home_activity_planning
      - safety_guidance
      - draft_generation
      - draft_editing
    prompt_file: prompts/parent_main_tutor.md
    selectable: false
    role_category: parent

  - id: parent_insect_agent
    kind: expert
    name: 昆虫观察专家
    role: 家庭昆虫观察与生态专家
    description: 指导家庭环境下的昆虫观察、识别推理和非侵扰活动。
    capabilities: [insect_observation, identification_reasoning, non_intrusive_guidance, family_activity]
    prompt_file: prompts/parent_expert.md
    selectable: true
    role_category: parent

  - id: parent_nature_agent
    kind: expert
    name: 自然生态专家
    role: 家庭自然观察专家
    description: 指导家庭周边植物、土壤、天气与生态关系观察。
    capabilities: [ecosystem_relationships, seasonal_change, family_activity]
    prompt_file: prompts/parent_expert.md
    selectable: true
    role_category: parent

  - id: parent_mathematics_agent
    kind: expert
    name: 数据探究专家
    role: 家庭数学与数据分析专家
    description: 指导使用常见家庭工具开展测量、计数、比较和数据表达。
    capabilities: [measurement, sampling, statistics, family_activity]
    prompt_file: prompts/parent_expert.md
    selectable: true
    role_category: parent

  - id: parent_safety_agent
    kind: expert
    name: 家庭活动安全专家
    role: 家庭探究安全专家
    description: 评估家庭空间、材料和工具风险，提供适龄安全边界。
    capabilities: [risk_assessment, tool_safety, biological_ethics, family_activity]
    prompt_file: prompts/parent_expert.md
    selectable: true
    role_category: parent

  - id: parent_physics_agent
    kind: expert
    name: 科学探究专家
    role: 家庭科学探究专家
    description: 指导低成本家庭实验、变量控制、观察记录和解释。
    capabilities: [inquiry_question, variable_control, experiment_design, family_activity]
    prompt_file: prompts/parent_expert.md
    selectable: true
    role_category: parent
